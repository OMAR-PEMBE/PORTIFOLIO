services:
  - type: web
    name: omar-pembe-portfolio
    runtime: docker
    plan: free
    healthCheckPath: /health.php
    autoDeployTrigger: commit
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CONTACT_RECIPIENT
        sync: false
      - key: CONTACT_FROM
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false
      - key: APP_DATA_DIR
        value: /var/www/storage/data
      - key: UPLOAD_STORAGE_DIR
        value: /var/www/storage/uploads
